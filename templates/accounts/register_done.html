{% extends "base.html" %}
{% block title %}Account created | Student PMS{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <div class="card auth-card">
        <div class="card-body p-5 text-center">
            <span class="auth-brand"><i class="bi bi-check-lg"></i></span>
            <h4 class="fw-bold mt-3">Account created</h4>
            <p class="text-muted">
                Your account has been created successfully. You can now sign in and start using the platform.
            </p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
