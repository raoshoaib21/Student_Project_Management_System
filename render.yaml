# Render Blueprint — Student Project Management System
# Deploy: connect this repo on https://dashboard.render.com/blueprints
# The free web service spins down after ~15 min of inactivity; it wakes on demand.

databases:
  - name: student-pms-db
    plan: free
    databaseName: student_pms
    user: student_pms

services:
  - type: web
    name: student-pms
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: "gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: student-pms.onrender.com
      - key: TIME_ZONE
        value: UTC
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DATABASE_URL
        fromDatabase:
          name: student-pms-db
          property: connectionString
      # Optional SMTP for real verification/reset emails (leave blank to disable):
      # - key: DEFAULT_FROM_EMAIL
      #   value: Student PMS <noreply@yourdomain.com>
      # - key: EMAIL_HOST
      #   value: smtp.yourprovider.com
      # - key: EMAIL_HOST_USER
      #   value: noreply@yourdomain.com
      # - key: EMAIL_HOST_PASSWORD
      #   value: your-smtp-password
