{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Reset password | Student PMS{% endblock %}
{% block content %}
<div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-4">
            <h4 class="fw-bold text-center mb-1">Forgot your password?</h4>
            <p class="text-muted text-center mb-4">Enter your email and we'll send you a reset link.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
            </form>
        </div>
    </div>
    <p class="text-center mt-3 text-muted small">
        Remembered it? <a href="{% url 'accounts:login' %}">Back to login</a>
    </p>
</div>
{% endblock %}
