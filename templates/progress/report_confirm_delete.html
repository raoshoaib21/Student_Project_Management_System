{% extends "base.html" %}
{% block title %}Delete Progress Report | Student PMS{% endblock %}
{% block content %}

<div class="card border-0 shadow-sm mx-auto" style="max-width: 560px;">
    <div class="card-body text-center p-4">
        <i class="bi bi-exclamation-triangle fs-1 text-danger d-block mb-3"></i>
        <h4 class="fw-bold mb-2">Delete Week {{ report.week_number }} report?</h4>
        <p class="text-muted">This permanently removes the report and its feedback. This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash me-1"></i>Yes, delete
                </button>
                <a href="{{ report.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
