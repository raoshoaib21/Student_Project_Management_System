{% extends "base.html" %}
{% block title %}Password changed | Student PMS{% endblock %}
{% block content %}
<div class="container" style="max-width: 520px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-5 text-center">
            <i class="bi bi-check-circle fs-1 text-success"></i>
            <h4 class="fw-bold mt-3">Password changed successfully</h4>
            <p class="text-muted">You can now sign in with your new password.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Go to Login</a>
        </div>
    </div>
</div>
{% endblock %}
