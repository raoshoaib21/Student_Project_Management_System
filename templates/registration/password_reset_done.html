{% extends "base.html" %}
{% block title %}Check your email | Student PMS{% endblock %}
{% block content %}
<div class="container" style="max-width: 520px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-5 text-center">
            <i class="bi bi-envelope-check fs-1 text-success"></i>
            <h4 class="fw-bold mt-3">Reset link sent</h4>
            <p class="text-muted">
                If an account exists for that email, you'll receive a link to reset your password shortly.
                Check your inbox (and spam folder).
            </p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
