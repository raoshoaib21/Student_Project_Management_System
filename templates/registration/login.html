{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Login | Student PMS{% endblock %}
{% block content %}
<div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-4">
            <h4 class="fw-bold text-center mb-1">Welcome back</h4>
            <p class="text-muted text-center mb-4">Sign in to continue</p>
            {% crispy form %}
            <hr>
            <p class="text-center mb-0">
                <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none">Forgot password?</a>
            </p>
        </div>
    </div>
    <p class="text-center mt-3 text-muted small">
        New student? <a href="{% url 'accounts:register' %}">Create an account</a>
    </p>
</div>
{% endblock %}
