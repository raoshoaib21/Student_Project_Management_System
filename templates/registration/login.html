{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Login | Student PMS{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 420px;">
    <div class="card auth-card">
        <div class="card-body p-4 pt-5">
            <span class="auth-brand"><i class="bi bi-kanban"></i></span>
            <h4 class="fw-bold text-center mb-1 mt-3">Welcome back</h4>
            <p class="text-muted text-center mb-4">Sign in to continue</p>
            {% crispy form %}
            <hr>
            <p class="text-center mb-0">
                <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none">Forgot password?</a>
            </p>
        </div>
    </div>
    <p class="text-center mt-3 text-muted small">
        New student? <a href="{% url 'accounts:register' %}">Create an account</a>
    </p>
</div>
{% endblock %}
