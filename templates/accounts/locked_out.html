{% extends "base.html" %}
{% block title %}Account locked | Student PMS{% endblock %}
{% block content %}
<div class="container" style="max-width: 520px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-5 text-center">
            <i class="bi bi-shield-lock fs-1 text-danger"></i>
            <h4 class="fw-bold mt-3">Too many failed attempts</h4>
            <p class="text-muted">
                Your account has been temporarily locked due to repeated failed login attempts.
                Please wait a few minutes before trying again.
            </p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
