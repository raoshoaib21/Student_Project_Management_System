{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Register | Student PMS{% endblock %}
{% block content %}
<div class="container" style="max-width: 520px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-4">
            <h4 class="fw-bold text-center mb-1">Create your student account</h4>
            <p class="text-muted text-center mb-4">You'll need to verify your email before signing in.</p>
            {% crispy form %}
        </div>
    </div>
    <p class="text-center mt-3 text-muted small">
        Already have an account? <a href="{% url 'accounts:login' %}">Sign in</a>
    </p>
</div>
{% endblock %}
