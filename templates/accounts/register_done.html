{% extends "base.html" %}
{% block title %}Check your email | Student PMS{% endblock %}
{% block content %}
<div class="container" style="max-width: 520px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-5 text-center">
            <i class="bi bi-envelope-check fs-1 text-success"></i>
            <h4 class="fw-bold mt-3">Verification email sent</h4>
            <p class="text-muted">
                We've sent a verification link to your email address.
                Click the link to activate your account, then you can sign in.
            </p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Go to Login</a>
        </div>
    </div>
</div>
{% endblock %}
